name: backfill-metrics

# Ricalcola `daily_metrics` per un intervallo di giorni.
#
# Serve quando l'analytics giornaliero non ha girato: i dati GREZZI restano in
# DB (l'ingest è indipendente e continua a funzionare), ma mancano i valori
# DERIVATI — CTL/ATL/TSB, readiness, HRV z-score. È successo per 32 giorni,
# dal 23/08 al 22/09, per una migration non applicata.
#
# Solo manuale: è un'operazione di recupero, non una routine. compute_for è
# idempotente, quindi rieseguirlo su giorni già calcolati è sicuro.

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: "Data iniziale YYYY-MM-DD (vuoto = primo dato disponibile)"
        required: false
        default: ""
      to_date:
        description: "Data finale YYYY-MM-DD (vuoto = oggi)"
        required: false
        default: ""

# Permessi minimi: questo job non scrive sul repository.
permissions:
  contents: read

# Stesso gruppo dell'ingest: entrambi scrivono daily_metrics, e girare
# insieme significherebbe ricalcolare lo stesso giorno da due processi.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      PYTHONPATH: '.'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Backfill daily_metrics
        run: |
          ARGS=""
          [ -n "${{ github.event.inputs.from_date }}" ] && ARGS="$ARGS --from ${{ github.event.inputs.from_date }}"
          [ -n "${{ github.event.inputs.to_date }}" ]   && ARGS="$ARGS --to ${{ github.event.inputs.to_date }}"
          echo "Eseguo: python scripts/backfill_metrics.py $ARGS"
          python scripts/backfill_metrics.py $ARGS
