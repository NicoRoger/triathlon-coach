name: proactive-check-in

on:
  schedule:
    # Audit L5: doppio cron (estate UTC+2 / inverno UTC+1) + gate Rome-hour=18
    # nello step → 18:00 Europe/Rome tutto l'anno (Mar/Gio/Sab).
    - cron: '0 16 * * 2,4,6'  # estate: 18:00 Rome
    - cron: '0 17 * * 2,4,6'  # inverno: 18:00 Rome
  workflow_dispatch:

# Permessi minimi: questi job non scrivono sul repository.
permissions:
  contents: read

concurrency:
  group: proactive-check-in
  cancel-in-progress: true

jobs:
  check_in:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONPATH: '.'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Proactive Questions Check-In
        # Catch-up gate (come send_notification.py --rome-hour): invia dalle
        # 18:00 Rome a fine serata. Il vecchio gate "ora == 18" skippava ogni
        # run: i cron di GitHub arrivano con 2-4h di ritardo (18:48-20:20 UTC),
        # il job usciva 0 prima di Python e dal 25/08 nessuna domanda partiva,
        # con run sempre verdi. Il doppio invio (due cron nella finestra) è
        # bloccato dal cooldown 24h in proactive_questions.py.
        # workflow_dispatch manuale bypassa il gate.
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            HOUR=$(TZ='Europe/Rome' date +%-H)
            if [ "$HOUR" -lt 18 ]; then
              echo "Gate: ora Rome $HOUR < 18, troppo presto, skip"
              exit 0
            fi
          fi
          python -m coach.coaching.proactive_questions
